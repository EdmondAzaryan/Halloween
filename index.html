<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Picker Mini App</title>
    <!-- Подключение официального скрипта Telegram SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }
        #info-box {
            font-size: 18px;
            font-weight: 500;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Блок, куда мы выведем время, пришедшее из параметров ссылки -->
    <div id="info-box">Считываем данные...</div>

    <button id="sendTimeBtn">Отправить время в бот</button>

    <script>
        // Инициализируем объект Telegram WebApp
        const tg = window.Telegram?.WebApp;

        // Функция парсинга GET-параметров из адресной строки браузера
        def getParamFromUrl(paramName) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(paramName);
        }

        if (tg) {
            tg.ready();
            tg.expand(); // Раскрываем приложение на максимум

            // 1. Извлекаем значение, которое бот подставил вместо {current_time}
            const timeFromBot = getParamFromUrl('time');

            if (timeFromBot) {
                document.getElementById('info-box').innerText = `Время, переданное ботом: ${timeFromBot}`;
            } else {
                document.getElementById('info-box').innerText = "Бот не передал время в параметрах";
            }

            // 2. Настраиваем отправку данных обратно при клике на кнопку
            document.getElementById('sendTimeBtn').addEventListener('click', () => {
                const now = new Date();
                const formattedTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                // Передаем строку обратно боту. Это событие вызовет триггер WEB_APP_DATA в Python
                tg.sendData(`Пользователь подтвердил время: ${formattedTime}`);
                
                // Закрываем окно Mini App
                tg.close();
            });

        } else {
            document.body.innerHTML = '<h3 style="text-align:center; padding-top:50px;">Пожалуйста, откройте эту страницу внутри Telegram!</h3>';
        }
    </script>
</body>
</html>
