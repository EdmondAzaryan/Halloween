<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: #1a1a1a; color: #fff; padding: 20px; font-family: sans-serif;">
    <h2>Halloween 🎃</h2>
    <input type="text" id="userInput" placeholder="Напиши текст..." style="padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px;">
    <button onclick="sendData()" style="padding: 12px; width: 100%; background: #ffaa00; color: #000; font-weight: bold; border: none; border-radius: 5px; font-size: 16px;">Отправить в бота</button>

    <script>
        function sendData() {
            const text = document.getElementById('userInput').value.trim();
            if (!text) {
                alert('Введите текст!');
                return;
            }

            // Меняем пробелы на _, чтобы ссылка не ломалась
            const safeText = text.replace(/\s+/g, '_');
            
            // Имя твоего НОВОГО бота (testbot)
            const botUsername = "testbot"; 
            
            // Формируем ссылку
            const url = `https://t.me/${botUsername}?start=${encodeURIComponent(safeText)}`;
            
            // Переходим
            window.location.href = url;
        }
    </script>
</body>
</html>
