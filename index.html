<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Mini App</title>
    <!-- Официальный скрипт Telegram (ОБЯЗАТЕЛЕН) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif; background-color: #1a1a1a; color: #fff;
            padding: 20px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; margin: 0;
        }
        input, button {
            width: 100%; max-width: 300px; padding: 12px;
            font-size: 16px; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box;
        }
        input { background-color: #2b2b2b; color: #fff; border: 1px solid #ffaa00; }
        button { background-color: #ffaa00; color: #000; font-weight: bold; border: none; cursor: pointer; }
        #status { color: #ffaa00; margin-top: 10px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <h2>Halloween Mini App 🎃</h2>
    <input type="text" id="userInput" placeholder="Напишите текст..." />
    <button onclick="sendData()">Отправить в бота</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function sendData() {
            const text = document.getElementById('userInput').value.trim();
            if (!text) {
                alert('Введите текст!');
                return;
            }

            // Если открыто не в Телеграме — выводим предупреждение
            if (!tg || !tg.initData) {
                document.getElementById('status').innerText = "⚠️ Откройте через бота в Telegram!";
                return;
            }

            try {
                document.getElementById('status').innerText = "Отправляем данные...";
                // ОТПРАВЛЯЕМ ДАННЫЕ БОТУ (без ссылок и перезапусков)
                tg.sendData(JSON.stringify({ text: text }));
            } catch (e) {
                document.getElementById('status').innerText = "Ошибка: " + e.message;
            }
        }
    </script>
</body>
</html>
