<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Mini App</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 15px;
            box-sizing: border-box;
        }
        input, button {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ffaa00;
            box-sizing: border-box;
        }
        input {
            background-color: #2b2b2b;
            color: #fff;
        }
        button {
            background-color: #ffaa00;
            color: #000000;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #response-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            width: 100%;
            max-width: 300px;
            word-break: break-word;
            text-align: center;
            border: 1px dashed #ffaa00;
        }
    </style>
</head>
<body>

    <h2>Halloween Mini App 🎃</h2>
    
    <input type="text" id="userInput" placeholder="Напишите что-то боту..." />
    <button onclick="sendDataToBot()">Отправить в бота</button>

    <div id="response-box">Загрузка данных...</div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Читаем параметры из URL-строки
        const urlParams = new URLSearchParams(window.location.search);
        const timeParam = urlParams.get('time');
        const chatId = urlParams.get('chat_id');
        const botToken = urlParams.get('token');
        
        if (timeParam) {
            document.getElementById('response-box').innerText = "Информация из бота: " + timeParam;
        } else {
            document.getElementById('response-box').innerText = "Mini App готов к работе!";
        }

        // Прямая отправка данных через Telegram API HTTP-запрос
        function sendDataToBot() {
            const text = document.getElementById('userInput').value;
            if (!text.trim()) {
                alert('Пожалуйста, введите текст!');
                return;
            }

            if (!botToken || !chatId) {
                alert('Ошибка: Ссылка запущена без параметров авторизации бота!');
                return;
            }
            
            // Формируем текст сообщения для отправки в чат
            const messageText = `📩 Получено из Mini App:\n\n${text}`;
            const telegramApiUrl = `https://telegram.org{botToken}/sendMessage`;

            // Выполняем фоновый HTTP-запрос к серверам Telegram
            fetch(telegramApiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: messageText,
                    parse_mode: 'HTML'
                })
            })
            .then(response => {
                if (response.ok) {
                    // Если запрос прошел, закрываем Mini App
                    if (window.Telegram?.WebApp) {
                        window.Telegram.WebApp.close();
                    } else {
                        alert('Успешно отправлено! Можете закрыть страницу.');
                    }
                } else {
                    alert('Не удалось отправить сообщение через API. Проверьте токен.');
                }
            })
            .catch(error => {
                alert('Ошибка сети при отправке данных в Telegram API');
            });
        }
    </script>
</body>
</html>
