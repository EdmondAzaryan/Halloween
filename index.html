<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween</title>
</head>
<body style="background: #1a1a1a; color: #fff; padding: 20px; font-family: sans-serif;">
    <h2>Halloween 🎃</h2>
    
    <input type="text" id="userInput" placeholder="Напиши текст..." style="padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px;">
    
    <a id="sendLink" style="display: block; text-align: center; padding: 12px; background: #ffaa00; color: #000; text-decoration: none; font-weight: bold; border-radius: 5px; font-size: 16px;">
        Отправить в бота
    </a>

    <script>
        const input = document.getElementById('userInput');
        const link = document.getElementById('sendLink');
        
        // ТУТ ТЕПЕРЬ ПРАВИЛЬНЫЙ ЮЗЕРНЕЙМ
        const botUsername = "Bzhshzjh_bot"; 

        input.addEventListener('input', () => {
            const text = input.value.trim();
            if (text) {
                const safeText = text.replace(/\s+/g, '_');
                link.href = `https://t.me/${botUsername}?start=${encodeURIComponent(safeText)}`;
            } else {
                link.href = `https://t.me/${botUsername}`;
            }
        });
    </script>
</body>
</html>
