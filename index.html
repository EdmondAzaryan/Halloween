<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Калькулятор</title>
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container { text-align: center; padding: 20px; }
        input { padding: 10px; font-size: 16px; width: 80%; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 15px; }
        button { padding: 10px 20px; font-size: 16px; background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); border: none; border-radius: 8px; cursor: pointer; }
        .result { margin-top: 20px; font-weight: bold; font-size: 18px; color: green; }
    </style>
</head>
<body>

<div class="container">
    <h2>Введите сумму заказа:</h2>
    <input type="number" id="amount" placeholder="Например, 1000">
    <button onclick="sendToBot()">Рассчитать скидку</button>
    
    <!-- Сюда выведем ответ от бота, если он передан в URL -->
    <div class="result" id="bot-response"></div>
</div>

<script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Разворачиваем приложение на весь экран

    // 1. ОТПРАВКА ИЗ MINI APP В БОТА
    function sendToBot() {
        const amount = document.getElementById('amount').value;
        if (!amount) return alert('Введите сумму!');

        // Формируем JSON-строку для отправки
        const data = JSON.stringify({ total_amount: amount });
        
        // Отправляем данные боту (после этого Mini App закроется автоматически)
        tg.sendData(data);
    }

    // 2. ПОЛУЧЕНИЕ ИЗ БОТА В MINI APP (Через URL параметры)
    const urlParams = new URLSearchParams(window.location.search);
    const discount = urlParams.get('discount');
    const finalPrice = urlParams.get('final');

    if (discount && finalPrice) {
        document.getElementById('bot-response').innerText = `Ваша скидка: ${discount}%! Итого к оплате: ${finalPrice} руб.`;
    }
</script>

</body>
</html>
