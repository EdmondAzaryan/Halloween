<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Mini App</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        input, button {
            width: 100%; max-width: 300px; padding: 12px;
            font-size: 16px; border-radius: 8px; margin-bottom: 15px;
            box-sizing: border-box;
        }
        input { background-color: #2b2b2b; color: #fff; border: 1px solid #ffaa00; }
        button {
            background-color: #ffaa00; color: #000; font-weight: bold;
            border: none; cursor: pointer;
        }
        #status { color: #ffaa00; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Halloween Mini App 🎃</h2>
    <input type="text" id="userInput" placeholder="Напишите текст..." />
    <button onclick="sendData()">Отправить в бота</button>
    <div id="status"></div>

    <script>
        // Достаем имя бота из ссылки
        const urlParams = new URLSearchParams(window.location.search);
        const botUsername = urlParams.get('bot') || "Bshshzj_bot";
        const tg = window.Telegram?.WebApp;
        if (tg) tg.ready();

        function sendData() {
            const text = document.getElementById('userInput').value.trim();
            if (!text) {
                alert('Введите текст!');
                return;
            }

            // Меняем пробелы на подчеркивания, чтобы ссылка не сломалась
            const safeText = text.replace(/\s+/g, '_');

            // Формируем обычную deep-link ссылку для бота
            const deepLink = "https://t.me/" + botUsername + "?start=" + encodeURIComponent(safeText);

            document.getElementById('status').innerText = "Открываем бота...";
            
            // Пытаемся открыть ссылку через Telegram (если это Mini App)
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(deepLink);
            } else {
                // Если не сработало - открываем как обычную ссылку
                window.location.href = deepLink;
            }
        }
    </script>
</body>
</html>
