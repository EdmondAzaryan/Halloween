<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        input, button { width: 100%; max-width: 300px; padding: 12px; font-size: 16px; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        input { background-color: #2b2b2b; color: #fff; border: 1px solid #ffaa00; }
        button { background-color: #ffaa00; color: #000; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Halloween Mini App 🎃</h2>
    <input type="text" id="userInput" placeholder="Напиши текст..." />
    <button onclick="sendData()">Отправить в бота</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        function sendData() {
            const text = document.getElementById('userInput').value.trim();
            if (!text) {
                alert('Введите текст!');
                return;
            }
            // Отправляем данные боту
            tg.sendData(JSON.stringify({ text: text }));
        }
    </script>
</body>
</html>
