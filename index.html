<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <!-- Официальный скрипт Telegram Web App SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        input, button {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #response-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(0,0,0,0.05);
            width: 100%;
            max-width: 300px;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <h2>Привет от Mini App!</h2>
    
    <input type="text" id="userInput" placeholder="Введите сообщение для бота..." />
    <button onclick="sendDataToBot()">Отправить в бота</button>

    <div id="response-box">Здесь будет ответ от бота...</div>

    <script>
        // Инициализация WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на весь экран

        // Функция отправки данных из Mini App в бота
        function sendDataToBot() {
            const text = document.getElementById('userInput').value;
            if (!text.trim()) {
                alert('Введите текст!');
                return;
            }
            // sendData закрывает мини-апп и шлет строку/JSON в чат с ботом как системное сообщение
            tg.sendData(JSON.stringify({ message: text }));
        }

        // --- Обратная связь: получение данных ОТ БОТА в Mini App ---
        // Вариант А: Чтение параметров инициализации (initDataUnsafe), переданных ботом при открытии
        const initData = tg.initDataUnsafe;
        if (initData && initData.start_param) {
            document.getElementById('response-box.innerHTML').innerText = 'Параметр от бота: ' + initData.start_param;
        }

        // Вариант Б: Получение сообщений/данных через CloudStorage или кастомные события (если используется бэкенд с WebSocket/Polling)
        // Пример слушателя кастомных событий или данных от бэкенда бота:
        window.addEventListener('message', (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.fromBot) {
                    document.getElementById('response-box').innerText = 'Ответ из бота: ' + data.fromBot;
                }
            } catch (e) {
                // Игнорируем сторонние сообщения
            }
        });
    </script>
</body>
</html>
