<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        input, button {
            width: 100%; max-width: 300px; padding: 12px;
            font-size: 16px; border-radius: 8px; margin-bottom: 15px;
            box-sizing: border-box;
        }
        input { background-color: #2b2b2b; color: #fff; border: 1px solid #ffaa00; }
        button {
            background-color: #ffaa00; color: #000; font-weight: bold;
            border: none; cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Halloween Mini App 🎃</h2>
    <input type="text" id="userInput" placeholder="Напишите что-то боту..." />
    <button onclick="sendData()">Отправить в бота</button>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.ready();

        function sendData() {
            const text = document.getElementById('userInput').value.trim();
            if (!text) {
                alert('Введите текст!');
                return;
            }

            // Получаем имя бота из URL (которое передал Python)
            const urlParams = new URLSearchParams(window.location.search);
            const botUsername = urlParams.get('bot') || "Bshshzj_bot"; // Если нет - ставим твой

            // Заменяем пробелы на _, так как Телеграм не любит пробелы в ссылках
            const safeText = encodeURIComponent(text.replace(/\s+/g, '_'));

            // Формируем ссылку. ВАЖНО: здесь используется startapp, а не start!
            const deepLink = `https://t.me/${botUsername}?startapp=${safeText}`;

            // Открываем Телеграм по этой ссылке (Mini App закроется, откроется чат с ботом)
            window.location.href = deepLink;
        }
    </script>
</body>
</html>
