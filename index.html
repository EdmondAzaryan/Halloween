<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Halloween</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: #1a1a1a; color: #fff; padding: 20px;">
    <h2>Halloween Mini App 🎃</h2>
    <input type="text" id="userInput" placeholder="Напиши текст..." style="padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px;">
    <button id="sendBtn" style="padding: 10px; width: 100%; background: #ffaa00; color: #000; font-weight: bold; border: none;">Отправить в бота</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        document.getElementById('sendBtn').addEventListener('click', () => {
            const text = document.getElementById('userInput').value;
            if (text) {
                tg.sendData(JSON.stringify({ text: text }));
                tg.close();
            }
        });
    </script>
</body>
</html>
