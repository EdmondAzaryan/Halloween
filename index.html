<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Halloween</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: #1a1a1a; color: #fff; padding: 20px; font-family: sans-serif;">
    <h2>Halloween Mini App 🎃</h2>
    <input type="text" id="userInput" placeholder="Напиши текст..." style="padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px;">
    <button onclick="sendData()" style="padding: 12px; width: 100%; background: #ffaa00; color: #000; font-weight: bold; border: none; border-radius: 5px;">Отправить в бота</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        function sendData() {
            const text = document.getElementById('userInput').value.trim();
            if (!text) { alert('Введите текст!'); return; }

            // Берем имя бота из ссылки (в коде бота мы его передадим)
            const botUsername = new URLSearchParams(window.location.search).get('bot') || "Bzhshzjh_bot"; // Проверь юзернейм!
            
            // Меняем пробелы на _ для ссылки
            const safeText = text.replace(/\s+/g, '_');
            
            const deepLink = `https://t.me/${botUsername}?start=${safeText}`;
            
            // Открываем ссылку внутри Телеграма
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(deepLink);
                tg.close(); // Закрываем окно
            } else {
                window.location.href = deepLink;
            }
        }
    </script>
</body>
</html>
