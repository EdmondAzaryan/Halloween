<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Mini App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 15px;
            box-sizing: border-box;
        }
        input, button {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ffaa00;
            box-sizing: border-box;
        }
        input {
            background-color: #2b2b2b;
            color: #fff;
        }
        button {
            background-color: #ffaa00;
            color: #000000;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #response-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            width: 100%;
            max-width: 300px;
            word-break: break-word;
            text-align: center;
            border: 1px dashed #ffaa00;
        }
    </style>
</head>
<body>

    <h2>Halloween Mini App 🎃</h2>
    
    <input type="text" id="userInput" placeholder="Напишите что-то боту..." />
    <button onclick="sendDataToBot()">Отправить в бота</button>

    <div id="response-box">Загрузка данных...</div>

    <script>
        // Считываем параметры из URL-строки
        const urlParams = new URLSearchParams(window.location.search);
        const timeParam = urlParams.get('time');
        const chatId = urlParams.get('chat_id');
        const serverUrl = urlParams.get('server_url'); // Адрес нашего веб-сервера бота
        
        if (timeParam) {
            document.getElementById('response-box').innerText = "Информация из бота: " + timeParam;
        } else {
            document.getElementById('response-box').innerText = "Mini App готов к работе!";
        }

        function sendDataToBot() {
            const text = document.getElementById('userInput').value;
            if (!text.trim()) {
                alert('Пожалуйста, введите текст!');
                return;
            }

            if (!chatId || !serverUrl) {
                alert('Ошибка: Не переданы ID чата или адрес сервера!');
                return;
            }

            document.getElementById('response-box').innerText = "Отправка данных...";

            // Отправляем обычный веб-запрос напрямую на бэкенд нашего бота
            fetch(`${serverUrl}/api/data`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: text
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    document.getElementById('response-box').innerText = "Успешно отправлено! Можно закрыть окно.";
                    // Если мы в Telegram, закрываем окно
                    if (window.Telegram?.WebApp) {
                        window.Telegram.WebApp.close();
                    }
                } else {
                    alert('Сервер вернул ошибку: ' + data.message);
                }
            })
            .catch(error => {
                alert('Не удалось связаться с сервером бота. Проверьте запуск бота и Ngrok.');
                document.getElementById('response-box').innerText = "Ошибка отправки.";
            });
        }
    </script>
</body>
</html>
