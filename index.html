<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Mini App</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 15px;
            box-sizing: border-box;
        }
        input, button {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ffaa00;
            box-sizing: border-box;
        }
        input {
            background-color: #2b2b2b;
            color: #fff;
        }
        button {
            background-color: #ffaa00;
            color: #000000;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #response-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            width: 100%;
            max-width: 300px;
            word-break: break-word;
            text-align: center;
            border: 1px dashed #ffaa00;
        }
    </style>
</head>
<body>

    <h2>Halloween Mini App 🎃</h2>
    
    <input type="text" id="userInput" placeholder="Напишите что-то боту..." />
    <button onclick="sendDataToBot()">Отправить в бота</button>

    <div id="response-box">Проверка Telegram...</div>

    <script>
        // Инициализируем сразу напрямую без циклов
        const tg = window.Telegram?.WebApp;

        function checkTelegram() {
            // Если объект есть и версия определена — мы внутри WebApp
            if (tg && tg.version) {
                tg.ready();
                tg.expand();

                // Читаем параметры из URL
                const urlParams = new URLSearchParams(window.location.search);
                const timeParam = urlParams.get('time');

                if (timeParam) {
                    document.getElementById('response-box').innerText = "Информация из бота: " + timeParam;
                } else {
                    document.getElementById('response-box').innerText = "WebApp готов. Бот не передал время.";
                }
            } else {
                // Если tg не найден, выводим ошибку прямо в блок текста
                document.getElementById('response-box').innerText = "Критическая ошибка: Запущено как обычный сайт, функции Telegram отключены!";
                document.getElementById('response-box').style.borderColor = "red";
                document.getElementById('response-box').style.color = "red";
            }
        }

        function sendDataToBot() {
            const text = document.getElementById('userInput').value;
            if (!text.trim()) {
                alert('Пожалуйста, введите текст!');
                return;
            }
            
            // Проверяем объект перед отправкой напрямую
            if (window.Telegram?.WebApp && window.Telegram.WebApp.version) {
                window.Telegram.WebApp.sendData(text);
                window.Telegram.WebApp.close();
            } else {
                alert('Ошибка: Невозможно отправить данные. Вы находитесь вне Telegram WebApp!');
            }
        }

        // Запуск проверки сразу при открытии страницы
        window.onload = checkTelegram;
    </script>
</body>
</html>
