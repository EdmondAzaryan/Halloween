<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Picker</title>
    <!-- Подключаем актуальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
            font-weight: bold;
        }
        #info {
            margin-bottom: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Сюда подставим время, которое пришло ИЗ БОТА -->
    <div id="info">Загрузка времени...</div>
    
    <button id="sendTimeBtn">Отправить текущее время</button>

    <script>
        const tg = window.Telegram?.WebApp;

        // --- 1. ПРИЕМ ДАННЫХ ИЗ БОТА (Через URL параметры) ---
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return params.get('time'); // Ищем параметр ?time=...
        }

        // --- 2. ОТПРАВКА ДАННЫХ В БОТА ---
        function sendTime() {
            if (!tg) {
                alert('Работает только внутри Telegram!');
                return;
            }
            
            const now = new Date();
            const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            // Отправляем строку в бот
            tg.sendData(`time:${time}`);
            tg.close();
        }

        // Инициализация при загрузке страницы
        if (tg) {
            tg.ready();
            tg.expand(); // Разворачиваем приложение для удобства

            // Читаем время, пришедшее из бота, и выводим на экран
            const timeFromBot = getUrlParams();
            if (timeFromBot) {
                document.getElementById('info').innerText = `Время из бота: ${timeFromBot}`;
            } else {
                document.getElementById('info').innerText = `Время не передано`;
            }

            document.getElementById('sendTimeBtn').addEventListener('click', sendTime);
        } else {
            document.body.innerHTML = '<p style="text-align:center;">Пожалуйста, запустите приложение в Telegram!</p>';
        }
    </script>
</body>
</html>
