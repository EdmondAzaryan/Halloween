<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <!-- Официальный SDK Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        input, button {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #response-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(0,0,0,0.05);
            width: 100%;
            max-width: 300px;
            word-break: break-word;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Mini App Работает!</h2>
    
    <input type="text" id="userInput" placeholder="Введите сообщение для бота..." />
    <button onclick="sendDataToBot()">Отправить в бота</button>

    <div id="response-box">Ожидание данных...</div>

    <script>
        const tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();

            // Чтение параметров из URL-строки (Передача ИЗ БОТА в Mini App)
            const urlParams = new URLSearchParams(window.location.search);
            const timeParam = urlParams.get('time');

            if (timeParam) {
                document.getElementById('response-box').innerText = "Получено из бота: " + timeParam;
            } else {
                document.getElementById('response-box').innerText = "Параметры от бота не переданы.";
            }
        } else {
            document.body.innerHTML = '<h3>Запустите приложение внутри Telegram!</h3>';
        }

        // Функция отправки данных (ИЗ Mini App в бот)
        function sendDataToBot() {
            const text = document.getElementById('userInput').value;
            if (!text.trim()) {
                alert('Введите текст!');
                return;
            }
            
            // Отправляем данные. В боте сработает фильтр WEB_APP_DATA
            tg.sendData(text);
            tg.close();
        }
    </script>
</body>
</html>
