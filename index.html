<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Mini App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 15px;
            box-sizing: border-box;
        }
        input, button {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ffaa00;
            box-sizing: border-box;
        }
        input {
            background-color: #2b2b2b;
            color: #fff;
        }
        button {
            background-color: #ffaa00;
            color: #000000;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #response-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            width: 100%;
            max-width: 300px;
            word-break: break-word;
            text-align: center;
            border: 1px dashed #ffaa00;
        }
    </style>
</head>
<body>

    <h2>Halloween Mini App 🎃</h2>
    
    <input type="text" id="userInput" placeholder="Напишите что-то боту..." />
    <button onclick="sendDataToBot()">Отправить в бота</button>

    <div id="response-box">Загрузка данных...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const timeParam = urlParams.get('time');
        const botUsername = urlParams.get('bot'); // Забираем юзернейм бота, переданный сервером

        if (timeParam) {
            document.getElementById('response-box').innerText = "Информация из бота: " + timeParam;
        } else {
            document.getElementById('response-box').innerText = "Mini App готов к работе!";
        }

        function sendDataToBot() {
            const text = document.getElementById('userInput').value;
            if (!text.trim()) {
                alert('Пожалуйста, введите текст!');
                return;
            }
            
            // Если имя бота почему-то не прилетело, ставим твой юзернейм по умолчанию
            const targetBot = botUsername ? botUsername : "Bshshzj_bot";
            
            // Заменяем пробелы на нижнее подчеркивание, так как Telegram не любит пробелы в командах старта
            const cleanText = encodeURIComponent(text.trim().replace(/\s+/g, '_'));
            
            // Глубокая ссылка, которая перезапустит твоего бота и передаст ему этот текст напрямую
            const deepLink = "https://t.me" + targetBot + "?start=" + cleanText;
            
            // Перенаправляем
            window.location.href = deepLink;
        }
    </script>
</body>
</html>
