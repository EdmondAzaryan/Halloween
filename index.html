<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Mini App</title>
    <!-- Официальный скрипт Telegram SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 15px;
            box-sizing: border-box;
        }
        input, button {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ffaa00;
            box-sizing: border-box;
        }
        input {
            background-color: #2b2b2b;
            color: #fff;
        }
        button {
            background-color: #ffaa00;
            color: #000000;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        #response-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            width: 100%;
            max-width: 300px;
            word-break: break-word;
            text-align: center;
            border: 1px dashed #ffaa00;
        }
    </style>
</head>
<body>

    <h2>Halloween Mini App 🎃</h2>
    
    <input type="text" id="userInput" placeholder="Напишите что-то боту..." />
    <button onclick="sendDataToBot()">Отправить в бота</button>

    <div id="response-box">Загрузка данных...</div>

    <script>
        // Инициализируем объект Telegram WebApp
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand(); // Разворачиваем окно на максимум
        }

        // Читаем параметры из URL-строки (Из бота в Mini App)
        const urlParams = new URLSearchParams(window.location.search);
        const timeParam = urlParams.get('time');
        
        if (timeParam) {
            document.getElementById('response-box').innerText = "Информация из бота: " + timeParam;
        } else {
            document.getElementById('response-box').innerText = "Mini App готов к работе!";
        }

        // Отправка данных обратно (Из Mini App в бот)
        function sendDataToBot() {
            const text = document.getElementById('userInput').value;
            if (!text.trim()) {
                alert('Пожалуйста, введите текст!');
                return;
            }
            
            if (window.Telegram?.WebApp) {
                // Отправляем строку. В боте сработает фильтр WEB_APP_DATA
                window.Telegram.WebApp.sendData(text);
                window.Telegram.WebApp.close(); // Закрываем Mini App
            } else {
                alert('Ошибка: объект Telegram не найден!');
            }
        }
    </script>
</body>
</html>
